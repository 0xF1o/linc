[project]
name = "linc"
version = "0.1.0"
description = "L3D in containers is a compatibility layer to run Lakedrops tooling on Macos and other plaforms that come with poor docker support"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # not allowed!
]

[project.scripts]
linc = "linc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linc.py"]